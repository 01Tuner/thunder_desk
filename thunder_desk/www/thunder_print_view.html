<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print View</title>
    <script>
        window.PagedConfig = {
            auto: true,
            after: (flow) => {
                console.log("Paged.js rendering finished.");
                const params = new URLSearchParams(window.location.search);
                if (params.get('trigger_print') === '1') {
                    setTimeout(() => {
                        window.addEventListener('afterprint', (event) => {
                            window.close();
                        });
                        window.print();
                    }, 500); // Small delay to ensure rendering is fully stable
                }
            }
        };
    </script>
    <script src="https://unpkg.com/pagedjs/dist/paged.polyfill.js"></script>
    <!-- Expose margin values as CSS custom properties and JS global -->
    <style>
        :root {
            --page-margin-top: {{ page_margin_top or 0 }}px;
            --page-margin-bottom: {{ page_margin_bottom or 0 }}px;
        }
    </style>
    <script>
        window.thunderPrintMargins = {
            top: {{ page_margin_top or 0 }},
            bottom: {{ page_margin_bottom or 0 }}
        };
    </script>
    <style>
        @page {
            size: A4;
            {% if page_margin_top or page_margin_bottom %}
                margin: {{ page_margin_top or 10 }}px 30px {{ page_margin_bottom or 10 }}px 30px;
            {% else %}
                margin: 10px 30px;
            {% endif %}

            @top-center {
                content: element(header);
            }

            @bottom-center {
                content: element(footer);
            }
        }

        body {
            font-family: sans-serif;
            line-height: 1.6;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        .page-header {
            position: running(header);
            height: {{ page_margin_top }}px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .page-footer {
            position: running(footer);
            height: {{ page_margin_bottom }}px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .page-content {
            background: white;
        }
    </style>
    {% if print_styles %}
    <!-- Dynamic Print Format Styles -->
    {{tag}}
    {{print_styles | safe}}
    {{tag_close}}
    {% endif %}

</head>

<body>
    <div class="page-content">
        {% if print_content %}
        <!-- Render the Frappe Print Format content -->
        {{ print_content | safe }}
        {% endif %}
    </div>
</body>
<style> 
    .no-letter-head {
        height: 20px;
    }
</style>
</html>
