<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Thunder Desk</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="icon" type="image/png" href="/assets/thunder_desk/images/icons/icon-32x32.png">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 75%, #020617 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(56, 189, 248, 0.2);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #2563eb;
            --accent-cyan: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        /* Subtle animated background glow */
        .ambient-glow {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.25) 0%, transparent 70%);
            border-radius: 50%;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            filter: blur(60px);
            pointer-events: none;
            animation: pulseGlow 6s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .offline-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2.75rem 2.25rem;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px var(--accent-glow);
            position: relative;
            z-index: 1;
        }

        .icon-wrapper {
            width: 88px;
            height: 88px;
            margin: 0 auto 1.5rem auto;
            border-radius: 20px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid rgba(56, 189, 248, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .icon-wrapper svg {
            width: 48px;
            height: 48px;
            filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.5));
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            margin-bottom: 1.25rem;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: #ef4444;
            border-radius: 50%;
            display: inline-block;
        }

        h1 {
            font-size: 1.65rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 0.75rem;
            color: #ffffff;
        }

        p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.55;
            margin-bottom: 2rem;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 0.85rem 1.25rem;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .footer-note {
            margin-top: 1.75rem;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <div class="offline-card">
        <div class="icon-wrapper">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M13 10V3L4 14h7v7l9-11h-7z" fill="url(#bolt-linear)"/>
                <defs>
                    <linearGradient id="bolt-linear" x1="4" y1="3" x2="20" y2="21" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#38bdf8"/>
                        <stop offset="0.5" stop-color="#60a5fa"/>
                        <stop offset="1" stop-color="#fbbf24"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <div class="status-badge" id="network-badge">
            <span class="status-dot"></span>
            <span id="network-status-text">Offline Mode</span>
        </div>

        <h1>Connection Lost</h1>
        <p>You are currently offline. Thunder Desk will automatically reconnect as soon as your internet connection is restored.</p>

        <div class="actions">
            <button class="btn btn-primary" id="retry-btn" onclick="retryConnection()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                </svg>
                Retry Connection
            </button>
            <a href="/dashboard" class="btn btn-secondary">
                Go to Dashboard
            </a>
        </div>

        <div class="footer-note">
            Thunder Desk &bull; Progressive Web App
        </div>
    </div>

    <script>
        function retryConnection() {
            const btn = document.getElementById('retry-btn');
            btn.innerHTML = 'Checking...';
            btn.style.opacity = '0.75';

            fetch('/api/method/frappe.ping', { method: 'HEAD', cache: 'no-store' })
                .then(() => {
                    window.location.reload();
                })
                .catch(() => {
                    setTimeout(() => {
                        btn.innerHTML = `
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                            </svg>
                            Retry Connection
                        `;
                        btn.style.opacity = '1';
                    }, 600);
                });
        }

        window.addEventListener('online', () => {
            const badge = document.getElementById('network-badge');
            const statusText = document.getElementById('network-status-text');
            badge.style.background = 'rgba(34, 197, 94, 0.15)';
            badge.style.color = '#4ade80';
            badge.style.borderColor = 'rgba(34, 197, 94, 0.3)';
            badge.querySelector('.status-dot').style.backgroundColor = '#22c55e';
            statusText.textContent = 'Reconnecting...';

            setTimeout(() => {
                window.location.reload();
            }, 800);
        });
    </script>
</body>
</html>
