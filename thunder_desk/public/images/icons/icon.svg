<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="30%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="4"/>
  <!-- Glow bolt -->
  <polygon points="278,64 128,272 262,272 234,448 384,240 250,240" fill="url(#bolt-grad)" filter="url(#glow)"/>
  <!-- Sharp bolt -->
  <polygon points="278,64 128,272 262,272 234,448 384,240 250,240" fill="url(#bolt-grad)"/>
</svg>